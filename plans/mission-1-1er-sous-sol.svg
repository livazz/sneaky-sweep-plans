<style>
svg{--bg:#f3f5f7;--paper:#ffffff;--ink:#1d2733;--muted:#5b6b7c;--line:#2c3a4a;--block:#c9d1da;--corridor:#eef4ea;--garden:#dcebd2;--snow:#e8f1f8;
--guard:#d2532e;--duct:#6b56c9;--door:#c62f3b;--badge:#c98a0c;--spy:#13856a;--other:#7a8794;--prop:#b77a0c;--water:#3b8fd6;--hide:#2f7d4f;--outfit:#b0408a;--switch:#d4a20a;--cam:#2b6cb0;--poi:#4d5b6a}
@media (prefers-color-scheme: dark){svg{--bg:#11171d;--paper:#18212a;--ink:#e4e9ee;--muted:#9aa9b8;--line:#c9d4df;--block:#3a4552;--corridor:#1f2b22;--garden:#1d2e1f;--snow:#25313c;
--guard:#f07a54;--duct:#a594f2;--door:#f0646e;--badge:#e9b44c;--spy:#3fc39d;--other:#95a3b0;--prop:#e9b44c;--water:#6fb3f0;--hide:#5fc488;--outfit:#e47bbf;--switch:#f2cd4a;--cam:#6ea8e8;--poi:#aebbc8}}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}.floor{fill:none}.void{fill:var(--bg)}.house{fill:var(--block);fill-opacity:.35}
.room{fill:var(--paper)}.corr{fill:var(--corridor)}.garden{fill:var(--garden)}.snow{fill:var(--snow)}
.block{fill:var(--block);stroke:var(--line);stroke-width:.6}.low{fill:var(--block);fill-opacity:.45;stroke:var(--block)}
.wall{stroke:var(--line);stroke-width:3.5;stroke-linecap:square}
.door{stroke:var(--muted);stroke-width:2;stroke-dasharray:2 3}.door-badge{stroke:var(--badge);stroke-width:4;stroke-dasharray:4 3}.door-locked{stroke:var(--door);stroke-width:4;stroke-dasharray:4 3}
.car{fill:var(--block);stroke:var(--line);stroke-width:1}.car.arrive{fill:var(--spy);fill-opacity:.25}.car.exit{fill:var(--guard);fill-opacity:.18}
.liftmark{font-size:13px;fill:var(--ink)}
.cone{fill:var(--guard);opacity:.17}.cone-o{fill:var(--other);opacity:.14}.camcone{fill:var(--cam);opacity:.16}.cam{fill:var(--cam)}
.round{stroke:var(--guard);stroke-width:1.3;stroke-dasharray:5 4;fill:none}.stop{fill:var(--guard)}.arrow{stroke:var(--guard)}
.ghost{fill:var(--guard);fill-opacity:.45;stroke:var(--guard);stroke-width:1.5}
@media (prefers-reduced-motion: reduce){.ghost{display:none}}
.guard{fill:var(--guard)}.other{fill:var(--other)}.down{fill:none;stroke:var(--guard);stroke-width:2;stroke-dasharray:3 2}
.face{stroke:var(--guard);stroke-width:2.2;stroke-linecap:round}.face-o{stroke:var(--other);stroke-width:1.6;stroke-linecap:round}
.spy{fill:var(--spy)}
.duct{stroke:var(--duct);stroke-width:5;opacity:.8;stroke-linecap:round}.grate{fill:var(--paper);stroke:var(--duct);stroke-width:2}.grate.secret{stroke-dasharray:2 2}.riser{fill:var(--duct);fill-opacity:.25;stroke:var(--duct);stroke-width:2}
.hide{fill:var(--hide);fill-opacity:.85}.outfit{fill:var(--outfit)}.switch{fill:var(--switch);stroke:var(--line);stroke-width:.8}.item{fill:var(--prop)}.prop{fill:var(--prop)}
.reach{fill:var(--prop);fill-opacity:.06;stroke:var(--prop);stroke-opacity:.6;stroke-width:1;stroke-dasharray:3 4}
.water{fill:var(--water);fill-opacity:.3;stroke:var(--water);stroke-width:1}
.poi{fill:var(--poi)}
.scale{stroke:var(--ink);stroke-width:2}
.title{font-size:20px;font-weight:600;fill:var(--ink)}.subtitle{font-size:13px;fill:var(--muted)}
.lbl{font-weight:600;fill:var(--ink);letter-spacing:.04em}
.sub{font-size:11px;fill:var(--muted)}.poi-t{font-size:11px;fill:var(--poi)}.duct-t{fill:var(--duct)}.item-t,.prop-t{fill:var(--prop)}
.gname{font-size:12px;font-weight:600;fill:var(--guard)}.oname{font-size:9px;fill:var(--other)}
.ini{font-size:10px;font-weight:700;fill:var(--paper)}
.leg{font-size:12px;fill:var(--muted)}
</style>
